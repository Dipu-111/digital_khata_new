name: digital_khata_new
description: Digital Khata - Track credit and payments
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.0

  # Local Database
  hive_flutter: ^1.1.0
  hive_generator: ^2.0.0
  build_runner: ^2.4.0

  # File Storage
  path_provider: ^2.1.0

  # Date Formatting
  intl: ^0.18.0

  # Sharing & Export
  share_plus: ^7.0.0
  csv: ^5.1.0

  # Biometric / Fingerprint
  local_auth: ^2.1.6
  flutter_secure_storage: ^9.0.0

  # Preferences
  shared_preferences: ^2.2.2

  # Icons (Optional - for WhatsApp)
  font_awesome_flutter: ^10.7.0
  # for printing
  pdf: ^3.10.0
  printing: ^5.11.0
  file_picker: ^8.0.0 
  fl_chart: ^0.68.0
  image_picker: ^1.0.7   
  #
  dio: ^5.4.0
   

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/DK.png"
  adaptive_icon_background: "#1D293D"
  adaptive_icon_foreground: "assets/images/DK.png"